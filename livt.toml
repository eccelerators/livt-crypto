[project]
name = "Livt.Crypto"
version = "1.0.5"
description = "Fixed-size cryptographic components for Livt, including AES, ChaCha20, SHA, MACs, and key derivation."
authors = ["Denis Vasilík"]
repository = "https://github.com/eccelerators/livt-crypto"
homepage = "https://github.com/eccelerators/livt-crypto"
keywords = ["fpga", "cryptography", "aes", "chacha20", "hash", "aead"]
license = "MIT"
path = "src"
outdir = "out"

[publish]
files = ["README.md", "CHANGELOG.md", "LICENSE"]

[project.organization]
name = "Eccelerators GmbH"
website = "https://eccelerators.com"

[tests]
path = "tests"
components = [
    "AesSBoxTest",
    "AesSBoxInverseTest",
    "Aes128Test",
    "AesDecryptBlock128Test",
    "Aes192Test",
    "AesDecryptBlock192Test",
    "Aes256Test",
    "AesDecryptBlock256Test",
    "AesCbc128Test",
    "AesCbc192Test",
    "AesCbc256Test",
    "AesCtr128Test",
    "AesCtr192Test",
    "AesCtr256Test",
    "Aes128GcmTest",
    "Aes192GcmTest",
    "Aes256GcmTest",
    "AesCmac128Test",
    "AesCmac192Test",
    "AesCmac256Test",
    "Aes256CtrDrbgTest",
    "Sha256Test",
    "Sha512Test",
    "HmacSha256Test",
    "HmacSha512Test",
    "HkdfSha256Test",
    "ChaCha20Test",
    "Poly1305Test",
    "ChaCha20Poly1305Test",
    "Sha3256Test",
    "Sha3512Test"
]

[build.debug]
warnings = ["all"]

[build.release]
warnings = ["all"]
